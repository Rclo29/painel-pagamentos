name: Verificar monitoramento de empenhos
on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuração e estado da base
        run: python3 scripts/verificar_empenhos.py
